name: Build check

# Verifies the app compiles cleanly and the unit test suite passes on a stock
# Windows runner for every push / PR to the stable and active foundation branches.
# Does not produce or publish anything.

on:
  workflow_dispatch:
  push:
    branches: [main, foundation/0.1]
  pull_request:
    branches: [main, foundation/0.1]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # Single source of truth for the SDK version: global.json at the repo root.
          global-json-file: ./global.json

      # Records which SDK the run resolved, so the log answers this itself.
      - name: Show SDK
        run: dotnet --info

      # Restoring the test project also restores the app project it references.
      - name: Restore
        run: dotnet restore NexusApp.Tests/NexusApp.Tests.csproj

      - name: Build (Release)
        run: dotnet build NexusApp/NexusApp.csproj -c Release --no-restore

      - name: Test (Release)
        run: dotnet test NexusApp.Tests/NexusApp.Tests.csproj -c Release --no-restore
