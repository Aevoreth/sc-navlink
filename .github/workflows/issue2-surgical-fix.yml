name: Issue 2 surgical test fix

on:
  push:
    branches:
      - fix/issue-2-sct-dispose-test

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-2-sct-dispose-test

      - name: Replace scheduler-sensitive assertion
        shell: python
        run: |
          from pathlib import Path

          path = Path("NexusApp.Tests/SctMarketServiceTests.cs")
          text = path.read_text(encoding="utf-8")
          old = '''        Assert.True(refresh.IsCompleted);\n        Assert.False(File.Exists(snapshotPath));   // a cancelled cycle never writes a snapshot\n        Assert.False(svc.FetchInProgress);\n        await refresh;\n'''
          new = '''        Assert.False(File.Exists(snapshotPath));   // a cancelled cycle never writes a snapshot\n        Assert.False(svc.FetchInProgress);\n        // Dispose waits for the service-side drain latch. The outer async task may transition to\n        // Completed immediately afterward, so await it with a short bound rather than sampling\n        // IsCompleted in that scheduler-sensitive gap.\n        await refresh.WaitAsync(TimeSpan.FromSeconds(1));\n'''
          if old not in text:
              raise SystemExit("Expected assertion block was not found; refusing to modify the file.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit test-only correction
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NexusApp.Tests/SctMarketServiceTests.cs
          git commit -m "test: avoid scheduler-sensitive SCT dispose assertion"
          git push origin HEAD:fix/issue-2-sct-dispose-test
